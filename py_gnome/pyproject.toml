
[build-system]
# note: using setuptools_scm for file finding, not versioning
#       we should probably do versioning later, but it requires tagging the git repo properly
requires = ["scikit-build-core", "cython", "numpy", "setuptools-scm"]
build-backend = "scikit_build_core.build"


[project]
name = "gnome"
authors = [
    {name = "Gnome team at NOAA/ORR/ERD", email = "orr.gnome@noaa.gov"},
]
description = "Particle tracking code with features specifically for oil spill modeling."
requires-python = ">=3.12, <3.14"
keywords = ["oilspill", "modeling", "particle-tracking"]
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Oceanography",
]

readme = "README.rst"

dynamic = ["version"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build]
# when we get the stable ABI build working.
# wheel.py-api = "cp312"
# wheel.py-api = "py3"  # dont want to hardcode this -- scikit build can figure it out
# sdist.include = ["tests/unit_tests"]
sdist.include = ["gnome/_version.py"]
sdist.exclude = ["scripts",
                 "tests/", # until we can figure out how to exclude the downloaded data files.
                 "gnome/cy_gnome/*.cpp"
                 ]

[tool.setuptools_scm]
root = ".."
version_file = "gnome/_version.py"

[tool.setuptools]
zip-safe = false


[tool.setuptools.packages.find]
where = ["gnome"]  # list of folders that contain the packages (["."] by default)
include = ["gnome*"]  # package names should match these glob patterns (["*"] by default)
# exclude = ["my_package.tests*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)


[project.scripts]
plot_grids = "gnome.scripting.plotting:main"

[tool.pytest.ini_options]
# ignore warnings from geopandas -- out of our control
filterwarnings = ["ignore:.*BlockManager to :DeprecationWarning",
                  "ignore:.*Possibly due to too larger :RuntimeWarning"]
testpaths = [
    "tests"
]
addopts = "--ignore=tests/profiling"

[tool.ruff.lint]
ignore = [
    "RUF012",  # mutable class attributes -- would need ClassVar across the whole codebase
    "DTZ001",  # datetime() without timezone
    "DTZ005",  # datetime.now() without timezone
    "DTZ006",  # datetime.fromtimestamp() without timezone
    "DTZ007",  # strptime() without timezone
    "BLE001",  # blind exceptions -- many are intentional catch-alls
    "B008",    # function calls in default args -- would break existing APIs
    "B019",    # lru_cache on methods
    "F821",    # undefined names -- false positives in .pyi stubs
    "F811",    # redefinition of unused name -- intentional in some modules
    "TRY002",  # create your own exception class
    "TRY003",  # long messages in exceptions
    "TRY004",  # type check without isinstance
    "S110",    # try/except/pass
    "E722",    # bare except
    "D419",    # empty docstring section
    "PLE0604", # invalid __all__ entry
    "RUF059",  # unused unpacking target
    "B026",    # star-arg after keyword
    "F524",    # missing format argument
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports are intentional in package __init__ files
"gnome/utilities/geometry/BBox.py" = ["N999"]  # legacy uppercase filename
"gnome/utilities/geometry/PinP.py" = ["N999"]  # legacy uppercase filename

# [project.optional-dependencies]
